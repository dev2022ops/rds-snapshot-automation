on:
  push:
    branches:
      - main  # Triggers the workflow on pushes to the main branch

permissions:
  id-token: write # Mandatory for requesting the AWS OIDC JWT token
  contents: read  # Required to checkout the repository code

env:
  AWS_REGION: us-east-1

jobs:
  ConnectAndDeploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout repository code
      - name: Git checkout
        uses: actions/checkout@v4

      # 2. Authenticate with AWS via OIDC
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::779638603313:role/GitHubAction-AssumeRoleWithAction
          aws-region: us-east-1 # Change to your preferred AWS region


      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan
