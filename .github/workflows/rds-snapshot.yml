name: Terraform

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  terraform:
    name: Terraform Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      # 1. Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Debug GitHub OIDC claims
      #    This does NOT print the actual OIDC token.
      - name: Debug GitHub OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');

            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            console.log("===== GitHub OIDC Claims =====");
            console.log("Issuer:             ", payload.iss);
            console.log("Audience:           ", payload.aud);
            console.log("Subject:            ", payload.sub);
            console.log("Repository:         ", payload.repository);
            console.log("Repository ID:      ", payload.repository_id);
            console.log("Repository Owner:   ", payload.repository_owner);
            console.log("Owner ID:           ", payload.repository_owner_id);
            console.log("Ref:                ", payload.ref);
            console.log("Workflow:           ", payload.workflow);
            console.log("Job Workflow Ref:   ", payload.job_workflow_ref);
            console.log("==============================");

      # 3. Authenticate to AWS using GitHub OIDC
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::779638603313:role/GitHubAction-AssumeRoleWithAction
          aws-region: ${{ env.AWS_REGION }}

      # 4. Verify AWS authentication
      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      # 5. Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 6. Terraform initialization
      - name: Terraform Init
        run: |
          terraform init

      # 7. Terraform formatting
      - name: Terraform Format Check
        run: |
          terraform fmt -check

      # 8. Terraform validation
      - name: Terraform Validate
        run: |
          terraform validate

      # 9. Terraform plan
      - name: Terraform Plan
        run: |
          terraform plan
